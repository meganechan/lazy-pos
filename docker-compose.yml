services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lazy
      POSTGRES_PASSWORD: lazy
      POSTGRES_DB: lazypos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazy -d lazypos"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://lazy:lazy@db:5432/lazypos
      PORT: 8080
      # Empty credentials use mock mode. Inject real values through secrets/env.
      BEAM_BOLT_API_BASE: ${BEAM_BOLT_API_BASE:-https://playground.api.beamcheckout.com}
      BEAM_BOLT_MERCHANT_ID: ${BEAM_BOLT_MERCHANT_ID:-}
      BEAM_BOLT_API_KEY: ${BEAM_BOLT_API_KEY:-}
      BEAM_WEBHOOK_SECRET: ${BEAM_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
